name: "Security: Fuzzing"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Max total fuzz time in seconds"
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [decode, decode_message]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: runtimes/rust
        env:
          DURATION: ${{ github.event_name == 'schedule' && '900' || github.event.inputs.duration || '60' }}
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp -R "fuzz/seed_corpus/${{ matrix.target }}/." "fuzz/corpus/${{ matrix.target }}/"
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="${DURATION}"

  go:
    name: Go (Decode)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false

      - name: Fuzz Decode
        working-directory: runtimes/go
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            duration="900s"
          elif [ -n "${{ github.event.inputs.duration }}" ]; then
            duration="${{ github.event.inputs.duration }}s"
          else
            duration="60s"
          fi
          go test ./internal/core -run=^$ -fuzz=FuzzDecode -fuzztime="${duration}"

  native:
    name: ${{ matrix.runtime }} (libFuzzer)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [c, cpp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Build and fuzz decode
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:quarantine_size_mb=16
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            duration="900"
          elif [ -n "${{ github.event.inputs.duration }}" ]; then
            duration="${{ github.event.inputs.duration }}"
          else
            duration="60"
          fi
          flags="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          build_dir="runtimes/${{ matrix.runtime }}/build-fuzz"
          cmake -S "runtimes/${{ matrix.runtime }}" -B "${build_dir}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTWILIC_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="${flags}" \
            -DCMAKE_CXX_FLAGS="${flags}"
          cmake --build "${build_dir}" --target decode_fuzzer --parallel "$(nproc)"
          mkdir -p "runtimes/${{ matrix.runtime }}/fuzz/corpus"
          cp -R "runtimes/${{ matrix.runtime }}/fuzz/seed_corpus/." "runtimes/${{ matrix.runtime }}/fuzz/corpus/"
          "${build_dir}/decode_fuzzer" -max_total_time="${duration}" -rss_limit_mb=4096 \
            "runtimes/${{ matrix.runtime }}/fuzz/corpus"
