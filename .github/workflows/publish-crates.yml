name: Publish crates

on:
  push:
    tags:
      - "runtimes/rust/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: runtimes/rust/v3.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse tag
    uses: ./.github/workflows/reusable-parse-runtime-tag.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      expected_language: rust

  publish:
    name: Publish to crates.io
    needs: parse
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: write
    defaults:
      run:
        working-directory: runtimes/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is ancestor of main
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ needs.parse.outputs.tag }}
        run: bash tools/ci/verify-tag-on-main.sh "${RELEASE_TAG}"

      - name: Verify tag and crate version
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ needs.parse.outputs.tag }}
        run: bash tools/ci/verify-rust-tag-version.sh "${RELEASE_TAG}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.parse.outputs.tag }}
          RELEASE_TITLE: ${{ needs.parse.outputs.language }} ${{ needs.parse.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --verify-tag
