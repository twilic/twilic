name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twilic-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select runtimes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected runtimes
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "matrix=$(bash tools/ci/select-runtimes.sh "${BASE_SHA}" "${HEAD_SHA}")" >> "${GITHUB_OUTPUT}"

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install documentation tooling
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check
      - name: Markdown lint
        run: pnpm lint

  runtime:
    name: Runtime - ${{ matrix.runtime }}
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        if: matrix.runtime == 'rust' || matrix.runtime == 'javascript'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup wasm-pack
        if: matrix.runtime == 'javascript'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.0

      - name: Setup Node.js
        if: matrix.runtime == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: matrix.runtime == 'javascript'
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install JavaScript dependencies
        if: matrix.runtime == 'javascript'
        working-directory: runtimes/javascript
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup uv and Python
        if: matrix.runtime == 'python'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.runtime == 'python'
        working-directory: runtimes/python
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Setup JVM
        if: matrix.runtime == 'java' || matrix.runtime == 'kotlin' || matrix.runtime == 'scala'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup sbt
        if: matrix.runtime == 'scala'
        uses: sbt/setup-sbt@v1

      - name: Setup .NET
        if: matrix.runtime == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Dart
        if: matrix.runtime == 'dart'
        uses: dart-lang/setup-dart@v1

      - name: Install Dart dependencies
        if: matrix.runtime == 'dart'
        working-directory: runtimes/dart
        run: dart pub get

      - name: Setup Lua
        if: matrix.runtime == 'lua'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'

      - name: Setup LuaRocks
        if: matrix.runtime == 'lua'
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Busted
        if: matrix.runtime == 'lua'
        run: luarocks install busted

      - name: Setup PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        if: matrix.runtime == 'php'
        working-directory: runtimes/php
        run: composer install --no-interaction --prefer-dist

      - name: Setup R
        if: matrix.runtime == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        if: matrix.runtime == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            testthat
            pkgload
            bit64

      - name: Setup Ruby
        if: matrix.runtime == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: runtimes/ruby

      - name: Check Swift toolchain
        if: matrix.runtime == 'swift'
        run: swift --version

      - name: Setup Zig
        if: matrix.runtime == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Elixir
        if: matrix.runtime == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '27'

      - name: Install Elixir dependencies
        if: matrix.runtime == 'elixir'
        working-directory: runtimes/elixir
        run: mix deps.get

      - name: Run runtime tests
        run: bash tools/test-runtime.sh "${{ matrix.runtime }}"
