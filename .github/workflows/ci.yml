name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twilic-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select runtimes
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected runtimes
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "matrix=$(bash tools/ci/select-runtimes.sh "${BASE_SHA}" "${HEAD_SHA}")" >> "${GITHUB_OUTPUT}"

  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install documentation tooling
        run: bun ci
      - name: Prettier check
        run: bun run format:check
      - name: Markdown lint
        run: bun run lint

  runtime:
    name: Runtime - ${{ matrix.runtime }}
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        if: matrix.runtime == 'rust' || matrix.runtime == 'javascript'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup wasm-pack
        if: matrix.runtime == 'javascript'
        run: |
          version="0.13.0"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${version}/${archive}" \
            --output "${archive}"
          tar -xzf "${archive}"
          sudo install -m 0755 "wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          rm -rf "${archive}" "wasm-pack-v${version}-x86_64-unknown-linux-musl"
          wasm-pack --version

      - name: Setup Node.js
        if: matrix.runtime == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        if: matrix.runtime == 'javascript'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install JavaScript dependencies
        if: matrix.runtime == 'javascript'
        working-directory: runtimes/javascript
        run: bun ci

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false

      - name: Setup uv and Python
        if: matrix.runtime == 'python'
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.runtime == 'python'
        working-directory: runtimes/python
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Setup JVM
        if: matrix.runtime == 'java' || matrix.runtime == 'kotlin' || matrix.runtime == 'scala'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup sbt
        if: matrix.runtime == 'scala'
        uses: sbt/setup-sbt@v1

      - name: Setup .NET
        if: matrix.runtime == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Dart
        if: matrix.runtime == 'dart'
        uses: dart-lang/setup-dart@v1

      - name: Install Dart dependencies
        if: matrix.runtime == 'dart'
        working-directory: runtimes/dart
        run: dart pub get

      - name: Setup Lua
        if: matrix.runtime == 'lua'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libreadline-dev libncurses-dev ca-certificates curl
          curl --fail --silent --show-error --location --output lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          tar -xzf lua.tar.gz
          make -C lua-5.4.8 -j"$(nproc)" linux
          sudo make -C lua-5.4.8 INSTALL_TOP=/usr/local install
          rm -rf lua.tar.gz lua-5.4.8

      - name: Setup LuaRocks
        if: matrix.runtime == 'lua'
        run: |
          curl --fail --silent --show-error --location --output luarocks.tar.gz https://luarocks.org/releases/luarocks-3.8.0.tar.gz
          tar -xzf luarocks.tar.gz
          (
            cd luarocks-3.8.0
            ./configure --with-lua=/usr/local
            make
            sudo make install
          )
          rm -rf luarocks.tar.gz luarocks-3.8.0

      - name: Install Busted
        if: matrix.runtime == 'lua'
        run: sudo luarocks install busted

      - name: Setup PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install PHP dependencies
        if: matrix.runtime == 'php'
        working-directory: runtimes/php
        run: composer install --no-interaction --prefer-dist

      - name: Setup R
        if: matrix.runtime == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install R dependencies
        if: matrix.runtime == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            testthat
            pkgload
            bit64

      - name: Setup Ruby
        if: matrix.runtime == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: runtimes/ruby

      - name: Check Swift toolchain
        if: matrix.runtime == 'swift'
        run: swift --version

      - name: Setup Zig
        if: matrix.runtime == 'zig'
        uses: step-security/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Elixir
        if: matrix.runtime == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Install Elixir dependencies
        if: matrix.runtime == 'elixir'
        working-directory: runtimes/elixir
        run: mix deps.get

      - name: Run runtime tests
        run: bash tools/test-runtime.sh "${{ matrix.runtime }}"
